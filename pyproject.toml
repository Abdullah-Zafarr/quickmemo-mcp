[project]
name = "vaultcraft"
version = "0.1.0"
description = "VaultCraft MCP - Markdown Zettelkasten Knowledge Vault & Daily Journal Server for Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
vaultcraft = "vaultcraft.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultcraft"]
