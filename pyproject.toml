[project]
name = "quickmemo"
version = "0.1.0"
description = "QuickMemo MCP - Minimalistic & Elegant Context Memo & Developer Scratchpad Server for Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
quickmemo = "quickmemo.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickmemo"]
